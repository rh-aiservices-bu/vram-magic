# VRAM Magic - Nginx Server Configuration
# Optimized for React SPA deployment with caching and security

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rate limiting
    limit_req zone=app burst=20 nodelay;

    # Security headers specific to this server
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Handle client-side routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;

        # Security: Prevent access to dotfiles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Static assets caching with versioning
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";

        # Serve pre-compressed files if available
        location ~* \.(js|css)$ {
            gzip_static on;
        }
    }

    # Service Worker caching
    location /sw.js {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Manifest files
    location ~* \.(webmanifest|manifest\.json)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # API endpoints (if any future backend integration)
    location /api/ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Proxy configuration would go here for backend services
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Model data files
    location /models/ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding";
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|svn|htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to backup/config files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}