# Build configuration
buildFilter:
  paths:
    - src/**
    - public/**
    - package.json
    - package-lock.json
    - vite.config.ts
    - index.html
  ignoredPaths:
    - docs/**
    - tests/**
    - .storybook/**
    - README.md